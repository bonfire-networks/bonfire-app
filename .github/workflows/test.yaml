name: Maybe test
on:
  workflow_dispatch:
    inputs:
      trigger_file:
        description: 'File path to check for changes'
        required: true
        default: 'mix.lock'
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main
    
jobs:
  check_file_changed:
    uses: ./.github/workflows/check_file_changed.yaml
    with:
      file: mix.lock

  # the `docs` job also runs when these change, on main
  check_docs_changed:
    uses: ./.github/workflows/check_file_changed.yaml
    with:
      file: docs/

  check_version_changed:
    uses: ./.github/workflows/check_version_changed.yaml

  # Compile + install the flavour ONCE, populating the cache the test matrix and the docs job restore, so they don't each pay for (and log) the same full build. Uses the same composite action they do.
  # The tests need a mix.lock change. The docs job also runs on main for a docs/ or version change, which needs this build but no tests.
  prepare:
    needs: [check_file_changed, check_docs_changed, check_version_changed]
    if: ${{ needs.check_file_changed.outputs.changed == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.check_docs_changed.outputs.changed == 'true' || needs.check_version_changed.outputs.version_changed == 'true')) }}
    runs-on: ubuntu-latest
    name: prepare flavour:${{matrix.flavour}} OTP ${{matrix.otp}} Elixir ${{matrix.elixir}}
    strategy:
      fail-fast: false
      matrix:
        flavour: ['community'] # 'social', 'coordination'
        otp: ['29.1.2'] # keep in sync with .tool-versions, and with the cache key in localise-pull.yaml
        elixir: ['1.20.5'] # keep in sync with .tool-versions, and with the cache key in localise-pull.yaml
        with_docker: ['easy']
    env:
      FLAVOUR: ${{matrix.flavour}}
      WITH_DOCKER: ${{matrix.with_docker}}
      CI: true
      MIX_ENV: test
      WITH_AI: "0"
      WITH_LV_NATIVE: "0"
      TEST_LOG_TRUNCATE: 340
      POOL_SIZE: 30
      TEST_LOG_LEVEL: notice
      # turns on the localisation annotator, which adds the pages each string renders on to the source .po files as `#. URLs:` comments for translators. Read when each extension compiles, so it must match the test jobs' env.
      BONFIRE_POT_URL_BASE: https://campground.bonfire.cafe
      SECRET_KEY_BASE: "kSNSvYkWk14onNdbYzhEqFyG5TzpOO9+FFlk5sIrhTk0RV6+FeL/nM8DWQffDah4woepgQdrP6J8cjWGyehcWcRWvIIWXsghp0yY9/fEjgfUekD15P9LGRCmu6exIQ6g"
      SIGNING_SALT: "NPkqpeTx/q9xGQRWwRpqBWI7bCxeHMAF4L2PHntfjVtd8GZD2BQKe9KLnkIR5WbLVdZt24FWuR+Hy5WoXaZM4APydGvC2+w2enJmskOckX5VY1Bpvm7JGKu+QymgIgK/"
      ENCRYPTION_SALT: "l+QT/gkdX722f57qSAUc+bZcqm5ZduXY4D0hp0glEiKdR267JsZ1/CZlrlhADcD8kzuaZGFWvJ2dlr6sujbzGQV5e04lKVIsZh3gfd8eqQBckIqH6L8TDRRz4M07YE+F"
    steps:
    - name: Cancel any already running test workflows
      uses: styfle/cancel-workflow-action@0.13.1
      with:
        access_token: ${{ github.token }}
    - uses: actions/checkout@v7
    - uses: ./.github/actions/prepare-bonfire
      with:
        otp: ${{matrix.otp}}
        elixir: ${{matrix.elixir}}
        flavour: ${{matrix.flavour}}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # the cache key does not include env vars, so this keeps builds made with the annotator apart from older ones made without it
        cache-suffix: -annotate

  test:
    needs: [check_file_changed, prepare]
    if: ${{ needs.check_file_changed.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    # not shared via an anchor: `github.job` isn't set yet when a job's name is evaluated
    name: ${{matrix.test_only}} flavour:${{matrix.flavour}} db:postgres otp:${{matrix.otp}} elixir:${{matrix.elixir}}
    strategy:
      fail-fast: false
      matrix:
        flavour: &flavours ['community'] # 'social', 'coordination'
        # `db-down-migrations` is not a test suite: it's the rollback check, run as its own matrix job so a failing down-migration doesn't show a passing test suite as red (and vice versa)
        test_only: ['backend', 'ui', 'federation-all', 'openid-all', 'masto-api', 'paginator', 'db-down-migrations'] # 'sonix'
        otp: &otps ['29.1.2'] # keep in sync with .tool-versions, and with the cache key in localise-pull.yaml
        elixir: &elixirs ['1.20.5'] # keep in sync with .tool-versions, and with the cache key in localise-pull.yaml
        with_docker: &with_dockers ['easy']
        # ^ test with latest versions + oldest supported (i.e. versions available in debian stable)
    env: &test_env
      FLAVOUR: ${{matrix.flavour}}
      # MIX_TEST_ONLY: ${{matrix.test_only}}
      WITH_DOCKER: ${{matrix.with_docker}}
      DB_ADAPTER: ${{ github.job == 'test-yugabyte' && 'yugabyte' || 'postgres' }}
      CI: true
      MIX_ENV: test
      WITH_AI: "0"
      WITH_LV_NATIVE: "0"
      TEST_LOG_TRUNCATE: 340
      POOL_SIZE: 30
      TEST_LOG_LEVEL: notice
      # see the prepare job: must match its value, since the build comes from its cache
      BONFIRE_POT_URL_BASE: https://campground.bonfire.cafe
      SECRET_KEY_BASE: "kSNSvYkWk14onNdbYzhEqFyG5TzpOO9+FFlk5sIrhTk0RV6+FeL/nM8DWQffDah4woepgQdrP6J8cjWGyehcWcRWvIIWXsghp0yY9/fEjgfUekD15P9LGRCmu6exIQ6g"
      SIGNING_SALT: "NPkqpeTx/q9xGQRWwRpqBWI7bCxeHMAF4L2PHntfjVtd8GZD2BQKe9KLnkIR5WbLVdZt24FWuR+Hy5WoXaZM4APydGvC2+w2enJmskOckX5VY1Bpvm7JGKu+QymgIgK/"
      ENCRYPTION_SALT: "l+QT/gkdX722f57qSAUc+bZcqm5ZduXY4D0hp0glEiKdR267JsZ1/CZlrlhADcD8kzuaZGFWvJ2dlr6sujbzGQV5e04lKVIsZh3gfd8eqQBckIqH6L8TDRRz4M07YE+F"
    # shared with `test-yugabyte`
    steps: &test_steps
    - uses: actions/checkout@v7
    # same composite action the prepare job ran, but in `restore` mode: the flavour install and build already happened there and are cached, so repeating them here only invalidates the restored build and costs ~6min per job (it still falls back to the full setup if the cache missed)
    - uses: ./.github/actions/prepare-bonfire
      with:
        otp: ${{matrix.otp}}
        elixir: ${{matrix.elixir}}
        flavour: ${{matrix.flavour}}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        setup: restore
        cache-suffix: -annotate
    - name: Run tests
      if: matrix.test_only != 'db-down-migrations'
      run: just test-${{matrix.test_only}}
    # failing tests still annotate the pages they reached, so this runs whatever the suite's result. The `localise_push` job below sends them to Transifex.
    - name: Upload the annotated source strings
      if: ${{ !cancelled() && matrix.test_only == 'ui' && github.ref == 'refs/heads/main' }}
      uses: actions/upload-artifact@v7
      with:
        name: localisation-annotated
        path: priv/localisation/*.po
    - name: Check database down migrations
      if: matrix.test_only == 'db-down-migrations'
      # create + migrate first: the test DB is normally brought into being by the app booting during `mix test`, but this job runs no tests, so without ecto.create `ecto.rollback` finds no database
      run: just db-create && just db-migrate && just db-rollback-all
    # only reached when the suite passed
    - name: Mark the suite as passing on Postgres
      if: github.job == 'test'
      run: touch postgres-passed
    - uses: actions/upload-artifact@v7
      if: github.job == 'test'
      with:
        name: postgres-passed-${{matrix.test_only}}
        path: postgres-passed
        retention-days: 1

  # Pushes the source strings the `ui` suite annotated to Transifex and opens a PR with them. always(): failing tests still annotate the pages they reached.
  localise_push:
    needs: [check_file_changed, test]
    if: ${{ always() && needs.check_file_changed.outputs.changed == 'true' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/localise-push.yaml
    with:
      from_current_run: true
    secrets: inherit

  # Changelog (on a mix.lock change) and docs, from the build `prepare` made, so no compile of their own. The docs are built in test env: `filter_modules` in mix.exs keeps the test helpers out.
  docs:
    needs: [check_file_changed, check_docs_changed, check_version_changed, prepare]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.check_file_changed.outputs.changed == 'true' || needs.check_docs_changed.outputs.changed == 'true' || needs.check_version_changed.outputs.version_changed == 'true') }}
    runs-on: ubuntu-latest
    name: Generate docs and/or changelog
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        flavour: *flavours
        otp: *otps
        elixir: *elixirs
        with_docker: *with_dockers
    env: *test_env
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/prepare-bonfire
      with:
        otp: ${{matrix.otp}}
        elixir: ${{matrix.elixir}}
        flavour: ${{matrix.flavour}}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        setup: restore
        cache-suffix: -annotate
    - name: Generate changelog (if mix.lock changed)
      if: ${{ needs.check_file_changed.outputs.changed == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # test env mocks HTTP (Tesla.Mock in config/test.exs) unless federating, and the datagrabber logs a failed fetch and writes an empty changelog anyway
        FEDERATE: "yes"
      run: |
        just mix changelog
        grep -q '^- ' docs/CHANGELOG-autogenerated.md || { echo "::error::The changelog has no entries, so the GitHub fetch probably failed: see the log above"; exit 1; }
    - name: Create Pull Request for changelog (if mix.lock changed)
      if: ${{ needs.check_file_changed.outputs.changed == 'true' }}
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "changelog [skip ci]"
        branch: changelog/update-${{ github.run_id }}
        title: "Automated changelog update"
        body: "This PR was created automatically by the workflow."
        base: main
        add-paths: docs/CHANGELOG-autogenerated.md
    - name: Generate docs
      run: just docs
    - name: Add version number
      run: |
        echo "${{ steps.version.outputs.current-version }}" > ./docs/exdoc/VERSION
    - name: Deploy docs
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/exdoc
        cname: docs.bonfirenetworks.org

  # Lists the suites that passed on Postgres (from the markers `test` uploads), so `test-yugabyte` only gets jobs for those, and a suite that failed on Postgres doesn't show up there as a passing job with every step skipped.
  postgres-passed:
    needs: [check_file_changed, test]
    # always(): `test` fails as a whole if any one suite fails, but the suites that passed should still run on YugabyteDB
    if: ${{ always() && needs.check_file_changed.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
    - id: list
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        suites=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '[.artifacts[].name | select(startswith("postgres-passed-")) | ltrimstr("postgres-passed-")] | tojson')
        echo "suites=$suites" >> "$GITHUB_OUTPUT"

  # The same suites on YugabyteDB, each only once it has passed on Postgres, so a YugabyteDB failure points at YugabyteDB rather than at a bug both databases share.
  # test-yugabyte:
  #   needs: [check_file_changed, prepare, postgres-passed]
  #   if: ${{ always() && needs.check_file_changed.outputs.changed == 'true' && needs.prepare.result == 'success' && needs.postgres-passed.outputs.suites != '[]' && needs.postgres-passed.outputs.suites != '' }}
  #   runs-on: ubuntu-latest
  #   name: ${{matrix.test_only}} flavour:${{matrix.flavour}} db:yugabyte otp:${{matrix.otp}} elixir:${{matrix.elixir}}
  #   # YugabyteDB support is experimental, so its failures show per job without failing the workflow
  #   continue-on-error: true
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       flavour: *flavours
  #       test_only: ${{ fromJSON(needs.postgres-passed.outputs.suites) }}
  #       otp: *otps
  #       elixir: *elixirs
  #       with_docker: *with_dockers
  #   env: *test_env
  #   steps: *test_steps

  # This job summarizes the test results and sets an output for downstream workflows
  test_success:
    needs: [test, check_file_changed]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.check_file_changed.outputs.changed == 'true' }}
    outputs:
      success: ${{ steps.check_test_success.outputs.all_tests_passed }}
    steps:
      - name: Check if all tests passed
        id: check_test_success
        run: |
          # Check overall matrix job status
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "All matrix jobs passed successfully"
            echo "all_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "One or more matrix jobs failed"
            echo "all_tests_passed=false" >> $GITHUB_OUTPUT
          fi
          
  # This job runs when no tracked files have changed and cancels the workflow: the inverse of `prepare`'s condition, so it doesn't cancel a docs-only run
  skip_workflow:
    needs: [check_file_changed, check_docs_changed, check_version_changed]
    runs-on: ubuntu-latest
    if: ${{ !(needs.check_file_changed.outputs.changed == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.check_docs_changed.outputs.changed == 'true' || needs.check_version_changed.outputs.version_changed == 'true'))) }}
    steps:
      - name: Log skipped reason
        run: echo "No changes detected in tracked files. Cancelling workflow."
      
      - name: Cancel workflow
        uses: andymckay/cancel-action@0.5