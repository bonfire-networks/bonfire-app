name: Pull translations from Transifex
on:
  workflow_call: # from localise.yaml, which owns the schedule
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Mondays, 03:00 UTC

# Opens a PR with the latest translated .po files, so step 1 (amd64) and step 2 (arm64) of the next release both build from the same commit.
# No bonfire build here: `tx pull` and `localise-prune` are plain shell. The pruning drops the locales ex_cldr cannot compile, and the PR's own test run covers the rest.

permissions:
  contents: write
  pull-requests: write

jobs:
  pull:
    name: Pull translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: ./.github/actions/install-tx
      # for the coverage escript that `localise-prune` runs: it needs Elixir but not a compiled Bonfire. Same versions as .tool-versions and test.yaml's matrix, so the cache key below matches the one its runs save.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.5"
      # the escript is reached through `deps/bonfire_common` (at the commit `mix.lock` pins), and `localise-prune` fetches deps for that. Restoring test.yaml's cache makes that fetch near nothing. Restore only: the paths must match the saved ones exactly, so `_build` comes down too though nothing here compiles.
      - uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp29.1.2-elixir1.20.5-community-annotate-mix-${{ hashFiles('mix.lock', 'config/**') }}
          restore-keys: ${{ runner.os }}-otp29.1.2-elixir1.20.5-community-annotate-mix-
      - name: Pull translations
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: |
          tx pull --minimum-perc 5 -f -a
          just localise-prune
      - name: Create Pull Request for translations
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "translations [skip ci]"
          branch: localisation/pull-${{ github.run_id }}
          title: "Automated translations update"
          body: "This PR was created automatically by the localise-pull workflow."
          base: main
          add-paths: priv/localisation/**
