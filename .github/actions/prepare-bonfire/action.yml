name: Prepare Bonfire
description: Install system + BEAM toolchain, install the flavour and build (or restore that build from the prepare job), and stage static assets.

inputs:
  otp:
    description: OTP version
    required: true
  elixir:
    description: Elixir version
    required: true
  flavour:
    description: Bonfire flavour to install
    required: true
  github-token:
    description: Token used to authenticate git fetches of GitHub deps
    required: true
  setup:
    description: >
      `full` installs the flavour and builds, then hands the result to the matrix jobs (the `prepare`
      job). `restore` picks that up instead of redoing it, as re-running the setup would invalidate the
      restored build and cost ~6min per job. Falls back to `full` if the handoff isn't there.
    required: false
    default: full

runs:
  using: composite
  steps:
    - name: Add system repositories
      shell: bash
      run: |
        sudo apt update
        sudo apt install ca-certificates curl
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        sudo chmod a+r /etc/apt/keyrings/docker.asc

        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

        sudo apt update
    - name: Install system deps
      shell: bash
      run: sudo apt install git tar file make build-essential docker-compose-plugin && sudo snap install --edge just --classic
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ inputs.otp }}
        elixir-version: ${{ inputs.elixir }}

    # ── Two DIFFERENT jobs, deliberately not sharing one cache ────────────────────────────────────
    # 1. BETWEEN runs: reuse the expensive fetch+compile. A hit here can come from an older commit
    #    (the key is mix.lock-based, and source changes without touching the lock), so it holds ONLY
    #    lock-derived content — never tracked source. Caching e.g. `config/` or `lib/` here would let
    #    a stale hit silently overwrite a checked-out change and test the wrong code.
    # 2. WITHIN this run: hand prepare's finished workspace to the matrix jobs. Keyed to the run (and
    #    attempt), so it's the same commit by construction and can safely contain everything.
    - name: Restore deps + build cache (between runs)
      id: deps-cache
      if: inputs.setup == 'full'
      uses: actions/cache@v6
      with:
        path: |
          deps
          _build
          extensions
          forks
        # the toolchain belongs in the key: a `_build` compiled under another OTP/Elixir is useless
        key: ${{ runner.os }}-otp${{ inputs.otp }}-elixir${{ inputs.elixir }}-${{ inputs.flavour }}-mix-${{ hashFiles('mix.lock') }}
        restore-keys: ${{ runner.os }}-otp${{ inputs.otp }}-elixir${{ inputs.elixir }}-${{ inputs.flavour }}-mix-

    - name: Restore prepared workspace (this run)
      id: run-cache
      if: inputs.setup == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: |
          deps
          _build
          extensions
          forks
          config
          lib
          priv/repo
          priv/static
          # tracked, but setup REWRITES it: `mix deps.get` resolves hex upgrades, so prepare's deps/ match prepare's lock, not the one from checkout, without this the matrix jobs die with "Unchecked dependencies … lock mismatch". Safe here (same run, same commit), and deliberately absent from the between-runs cache, where the lock is the key input.
          mix.lock
        # exact key only: a partial (restore-keys) hit would be another run's workspace
        key: ${{ runner.os }}-otp${{ inputs.otp }}-elixir${{ inputs.elixir }}-${{ inputs.flavour }}-workspace-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Install hex
      shell: bash
      run: mix local.hex --force
    - name: Install rebar
      shell: bash
      run: mix local.rebar --force
    - name: Configure Git authentication for GitHub
      shell: bash
      run: git config --global url."https://${{ inputs.github-token }}@github.com/".insteadOf "https://github.com/"
    # regenerates config/*/.env, which is deliberately NOT carried over (`_config_flavour` appends a
    # FLAVOUR= line each time, so a restored copy would accumulate them). Couple of seconds.
    - name: Prepare environment
      shell: bash
      run: just config

    # Skipped once prepare has done it: `deps-clean-*` plus the installer rewriting config invalidates
    # the restored `_build`, and the next mix invocation (`ext-migrations-copy`) then recompiles ~420
    # deps — ~6min per job, for work already paid for. Still runs if the handoff is missing, so a
    # failed prepare degrades to a self-sufficient job rather than a confusing failure.
    - name: Set things up
      if: inputs.setup == 'full' || steps.run-cache.outputs.cache-hit != 'true'
      shell: bash
      run: just pre-setup-dev && just _flavour_install ${{ inputs.flavour }} --yes && just _deps-post-get
    - name: Prepare static assets
      if: inputs.setup == 'full' || steps.run-cache.outputs.cache-hit != 'true'
      shell: bash
      # copy-only (no JS build): committed statics for Plug.Static + NextGenImage tests, plus
      # content-less stubs for the built JS/CSS (the cache-header tests assert headers, not content).
      # NextGen.variants/1 scans priv/static/images at COMPILE time, so force bonfire_ui_common to
      # recompile in case setup already compiled it before the images were in place.
      run: |
        UI_COMMON=$(test -d extensions/bonfire_ui_common && echo extensions/bonfire_ui_common || echo deps/bonfire_ui_common)
        (cd "$UI_COMMON/assets" && yarn prepare.static)
        mkdir -p priv/static/assets
        echo '/* CI stub */' > priv/static/assets/bonfire_basic.js
        echo '/* CI stub */' > priv/static/assets/bonfire_basic.css
        rm -rf _build/*/lib/bonfire_ui_common

    - name: Hand the prepared workspace to the matrix jobs
      if: inputs.setup == 'full'
      uses: actions/cache/save@v6
      with:
        path: |
          deps
          _build
          extensions
          forks
          config
          lib
          priv/repo
          priv/static
          # see comment on the restore step about mix.lock
          mix.lock
        key: ${{ runner.os }}-otp${{ inputs.otp }}-elixir${{ inputs.elixir }}-${{ inputs.flavour }}-workspace-${{ github.run_id }}-${{ github.run_attempt }}