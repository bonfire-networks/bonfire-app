location @app_upstream {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_pass http://127.0.0.1:4000;
        proxy_redirect off;
        proxy_read_timeout 240s;
}

# User uploads served directly by nginx
location /data/uploads/ {

  # must point to data/uploads/ in the app's working directory
  alias data/uploads/;

  autoindex off;

  # uploads (e.g. SVG) are served from the instance's origin, so stop any script in them from running if opened directly
  add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'" always;
  # let web clients on other origins read media (`crossorigin` images)
  add_header Access-Control-Allow-Origin "*" always;
  # NOTE: an add_header here replaces every add_header of the server block for this location: repeat those (e.g. HSTS) here too

}

# static images (e.g. the default avatar) are read cross-origin by web clients (`crossorigin` images)
location /images/ {

  root priv/static;

  add_header Access-Control-Allow-Origin "*" always;
  # NOTE: an add_header here replaces every add_header of the server block for this location: repeat those (e.g. HSTS) here too

  try_files $uri @app_upstream;

}

location / {

  root priv/static;
  
  index index.html; 

  try_files $uri $uri.html $uri/index.html @app_upstream;

}